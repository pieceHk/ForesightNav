name = "goat_val_seen_object"
dataset = "goat_val_seen"
semantic_source = "auto"
max_steps_per_subtask = 200

[mapping]
top_k = 10
keyframe_threshold = 0.30
pixel_delta = 0.15
warmup_keyframes = 10
rebuild_interval = 10
query_similarity = 0.18
query_support_radius_m = 0.35
query_minimum_support = 3
query_nms_radius_m = 1.0

[navigation]
projection_tolerance_m = 1.5
candidate_merge_radius_m = 0.25
trapped_warmup_steps = 30
trapped_window_steps = 25
trapped_radius_m = 0.05
# Explicit shared baseline: GOAT does not enable HM3Dv1-only verification.
candidate_track_radius_m = 1.0
candidate_blacklist_radius_m = 1.0
two_stage_verification = false
verification_window_steps = 6
verification_min_confirmations = 2
verification_pose_radius_m = 1.5
verification_min_peak_seem = 1.15
approach_ring = false
candidate_exhaustion_exploration = false
verify_es_agreement = false

[visualization]
# Keep GOAT and HM3Dv1 on the same snapshot contract.
per_keyframe_snapshots = true
