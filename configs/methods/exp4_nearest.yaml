name: exp4_nearest
ground_truth_semantics: false
mapping:
  keyframe_threshold: 0.3
  pixel_delta: 0.15
  warmup_keyframes: 10
  rebuild_interval: 10
  raw_frame_buffer: 2
  frame_compare_height: 48
  frame_compare_width: 64
  max_gaussians: 0
  max_keyframes: 0
  offload_fastsam_after_rebuild: false
  clip_coverage_diagnostic: false
query:
  top_k: 10
  query_similarity: 0.18
  query_support_radius_m: 0.35
  query_minimum_support: 3
  query_nms_radius_m: 1.0
  query_pool_size: 2000
  query_support_rerank_weight: 0.0025
navigation:
  semantic_source: detic
  projection_tolerance_m: 1.5
  candidate_merge_radius_m: 0.25
  candidate_track_radius_m: 1.0
  candidate_blacklist_radius_m: 1.5
  candidate_evidence_radius_m: 0.75
  candidate_promotion_margin: 2
  candidate_evidence_ranking: true
  query_action_rerank_enabled: true
  query_refresh_cadence_steps: 10
  query_w_semantic: 1.0
  query_w_support: 0.35
  query_w_recurrence: 0.3
  query_w_travel: 0.35
  query_w_novelty: 0.15
  query_w_revisit: 0.8
  query_w_failure: 1.0
  query_switch_margin: 0.15
  frontier_rerank_enabled: false
  trapped_warmup_steps: 30
  trapped_window_steps: 25
  trapped_radius_m: 0.05
  random_exploration_warmup_steps: 30
  recovery_history_size: 8
  recovery_novelty_weight: 0.65
  two_stage_verification: true
  verification_window_steps: 6
  verification_min_confirmations: 2
  verification_pose_radius_m: 1.5
  verification_min_peak_seem: 1.15
  verification_dual_score_gate: true
  verification_strong_peak_seem: 1.35
  verification_min_peak_clip: 0.12
  verification_min_observer_translation_m: 0.0
  verification_min_observer_yaw_deg: 0.0
  approach_ring: false
  candidate_exhaustion_exploration: false
  verify_es_agreement: false
  frontier_w_gain: 1.0
  frontier_w_clearance: 0.25
  frontier_w_travel: 0.35
  frontier_w_novelty: 0.2
  frontier_w_revisit: 0.75
  frontier_w_failure: 1.0
  frontier_switch_margin: 0.15
suffix:
  mode: blp_eq13
  candidate_cap: 5
  candidate_identity_quantum_m: 0.001
  suffix_weight: 0.35
  strict_geodesic: true
  euclidean_fallback: false
  mvp_evidence_states:
  - verified_positive
  - unknown
  blp_variant: nearest
  blp_shadow: false
  blp_calibration: results/exp4/meta/calibration.json
query_switch_cooldown_by_category:
  bed: 30
  couch: 20
  toilet: 10
  chair: 10
  plant: 20
  tv: 10
